<!DOCTYPE html>
<html lang="en" class="ouro-ui">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ouroboros</title>
    <script src="/static/theme.js"></script>
    <!-- The macOS desktop window may run this page under its transparent title bar (launcher_window_chrome.py);
         after theme.js, so the shell reads the painted palette with it. style.css reserves what it measures. -->
    <meta name="ouroboros-window-chrome" content="integrated">
    <link rel="stylesheet" href="/static/ui.css">
    <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/settings.css">
    <link rel="stylesheet" href="/static/model_roles.css">
    <link rel="stylesheet" href="/static/model_wait.css">
    <link rel="stylesheet" href="/static/room_work.css">
    <link rel="stylesheet" href="/static/cards.css">
    <link rel="stylesheet" href="/static/consciousness.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <script src="/static/chart.umd.min.js"></script>
    <script src="/static/purify.min.js"></script>
    <script src="/static/marked.min.js"></script>
    <script src="/static/highlight.min.js"></script>
    <script src="/static/vendor/katex/katex.min.js"></script>
    <script src="/static/vendor/katex/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="/static/viper-palette.css">
<link rel="stylesheet" href="/static/pane_workspace.css"><link rel="stylesheet" href="/static/reader_collaboration.css"><link rel="stylesheet" href="/static/sidebar_art.css"><link rel="stylesheet" href="/static/copilot_usage.css"><link rel="stylesheet" href="/static/projects_manager.css">
<link rel="stylesheet" href="/static/work_visibility.css">
<link rel="stylesheet" href="/static/project_hierarchy.css">
<link rel="stylesheet" href="/static/project_unread.css">
<link rel="stylesheet" href="/static/work_items.css">
    <link rel="stylesheet" href="/static/room_activity.css">
</head>
<body>
    <div id="app">
        <div id="nav-drawer-backdrop" class="nav-drawer-backdrop" hidden></div>
        <nav id="primary-sidebar" class="primary-sidebar" aria-label="Ouroboros navigation">
            <!-- Zones (docs/DESIGN.md "Shell"): a pinned head, the Projects list as the one scroller, the tools after it, the version and the update at the bottom edge. -->
            <div class="sidebar-head">
                <!-- The drawer's head (stack layout only): its one close control, exactly where the header's ☰ was. -->
                <div class="drawer-head">
                    <button id="nav-drawer-close" class="shell-icon-control nav-drawer-close" type="button" aria-label="Close navigation" aria-controls="primary-sidebar"></button>
                </div>
                <!-- Main Chat: rendered from the page registry (pages.js) -->
            </div>
            <section id="nav-projects" class="nav-section nav-projects" hidden>
                <div class="nav-projects-header"><!-- rendered from pages.js --></div>
                <div id="nav-projects-list" class="nav-projects-list"></div>
            </section>
            <div class="sidebar-foot">
                <!-- Files, Skills, Widgets, Dashboard, Settings: rendered from the page registry (pages.js) -->
                <div class="viper-sidebar-art" aria-hidden="true">
                    <div class="viper-sidebar-art-stack">
                        <div class="viper-sidebar-logo-row" data-logo-row="tools">
                            <img data-brand="gentoo" class="viper-sidebar-gentoo" src="/static/assets/sidebar-art/Gentoo_Linux_logo_matte.svg" width="595" height="623" alt="" draggable="false">
                            <span class="viper-sidebar-zed" data-brand="zed">
                                <img class="viper-sidebar-zed-light" src="/static/assets/sidebar-art/zed-light.svg" width="32" height="32" alt="" draggable="false">
                                <img class="viper-sidebar-zed-dark" src="/static/assets/sidebar-art/zed-dark.svg" width="32" height="32" alt="" draggable="false">
                            </span>
                            <img data-brand="podman" src="/static/assets/sidebar-art/podman.webp" width="32" height="32" alt="" draggable="false">
                            <img data-brand="antigravity" src="/static/assets/sidebar-art/antigravity.svg" width="32" height="32" alt="" draggable="false">
                        </div>
                        <div class="viper-sidebar-logo-row" data-logo-row="models">
                            <img data-brand="ouroboros" src="/static/assets/sidebar-art/ouroboros.png" width="1024" height="1024" alt="" draggable="false">
                            <span class="viper-sidebar-openai" data-brand="openai">
                                <img class="viper-sidebar-openai-light" src="/static/assets/sidebar-art/openai-light.svg" width="268" height="268" alt="" draggable="false">
                                <img class="viper-sidebar-openai-dark" src="/static/assets/sidebar-art/openai-dark.svg" width="268" height="268" alt="" draggable="false">
                            </span>
                            <img data-brand="claude" src="/static/assets/sidebar-art/claude.svg" width="248" height="248" alt="" draggable="false">
                            <img data-brand="gemini" src="/static/assets/sidebar-art/gemini.svg" width="32" height="32" alt="" draggable="false">
                        </div>
                        <img class="viper-sidebar-avatar" src="/static/assets/sidebar-art/viper.png" width="512" height="512" alt="" draggable="false">
                    </div>
                </div>
                <div class="sidebar-foot-meta">
                    <span id="nav-version"></span>
                </div>
            </div>
        </nav>
        <main id="content">
            <!-- Pages injected by JS -->
        </main>
        <div id="project-panel-backdrop" class="project-panel-backdrop" hidden></div>
        <aside id="project-panel" class="project-panel" hidden>
            <!-- Its header is the one page header, rendered by app.js (page_header.js): ☰ · name · status … × -->
            <div id="project-panel-body" class="project-panel-body"></div>
        </aside>
    </div>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
